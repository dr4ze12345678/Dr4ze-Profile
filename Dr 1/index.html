<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEXR4ZE.PROFILE</title>
    <style>
        /* ส่วนของการตกแต่งหน้าเว็บ (CSS) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000; /* สีพื้นหลังเว็บ */
            color: #333333; /* สีตัวอักษรหลัก */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #000000;
            padding: 40px;
            border-radius: 16px; /* ทำมุมโค้งมน */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); /* ใส่เงาให้ดูมีมิติ */
            text-align: center;
            max-width: 400px;
        }
       
        h1 {
            color: #370050; /* สีหัวข้อ */
            margin-bottom: 10px;
        }

        p {
            line-height: 1.6;
            color: #666666;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #370050;
            color: rgb(0, 0, 0);
            text-decoration: none; /* เอาเส้นใต้ลิงก์ออก */
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.3s; /* ทำเอฟเฟกต์เปลี่ยนสีนุ่มนวล */
        }

        /* เมื่อเอาเมาส์ไปชี้ที่ปุ่ม */
        .btn:hover {
            background-color: #004c99;
        }
    </style>
</head>
